name: CI / Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-frontend:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run Type Check
        working-directory: frontend
        run: pnpm run check

      - name: Build Frontend
        working-directory: frontend
        run: pnpm run build

  test-backend:
    name: Backend Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Ensure embedded web assets directory exists
        working-directory: backend
        run: mkdir -p web/dist && touch web/dist/index.html

      - name: Run Backend Tests with Race Detection
        working-directory: backend
        run: go test -tags wgpu24 -v -race -cover -skip '^(TestDoPing_Loopback|TestDoPing_NonExistent|TestResolveHostname|TestPingPoller|TestDiscover_SkipNonExistentIP)$' ./internal/...

      - name: Build Backend Binary
        working-directory: backend
        run: go build -tags wgpu24 -v ./cmd/twsnmpneo

  test-e2e:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build Backend Binary
        working-directory: backend
        run: go build -tags wgpu24 -o ../bin/twsnmpneo ./cmd/twsnmpneo

      - name: Install E2E Dependencies & Playwright Chromium
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: e2e
        run: pnpm test

      - name: Upload Playwright Report & Traces on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
