# Air configuration for TWSNMP NEO Go backend live reload
root = "."
tmp_dir = "tmp"

[build]
cmd = "sh -c 'COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo dev); go build -tags \"dev,wgpu24\" -ldflags \"-X main.version=v0.1.0 -X main.commit=$COMMIT\" -o ../bin/twsnmpneo ./cmd/twsnmpneo'"
bin = "../bin/twsnmpneo"
full_bin = "../bin/twsnmpneo --datadir ../data --debug"
include_ext = ["go"]
exclude_dir = ["web/dist", "tmp"]
include_dir = ["cmd", "internal", "web"]
exclude_regex = ["_test\\.go$"]
delay = 10000
stop_on_error = true
send_interrupt = true
kill_delay = 10000

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
