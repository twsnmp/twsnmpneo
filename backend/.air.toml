# Air configuration for TWSNMP NEO Go backend live reload
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -tags dev -o ../bin/twsnmpneo ./cmd/twsnmpneo"
bin = "../bin/twsnmpneo"
full_bin = "../bin/twsnmpneo --datadir ../data --debug"
include_ext = ["go"]
exclude_dir = ["web/dist", "tmp"]
include_dir = ["cmd", "internal", "web"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"
