[tools]
go = "1.27"
node = "22"
pnpm = "latest"
air = "latest"

[tasks.dev-frontend]
description = "Launch frontend development server with HMR (Vite)"
dir = "frontend"
run = "npm run dev"

[tasks.build-frontend]
description = "Build static frontend assets for Go embed packaging"
dir = "frontend"
run = "pnpm run build"

[tasks.test-backend]
description = "Run backend unit tests with race detection"
dir = "backend"
run = "go test -tags wgpu24 -race -v ./..."

[tasks.build]
description = "Compile release binary bundling frontend assets with version and git commit"
depends = ["build-frontend"]
dir = "backend"
run = '''
VERSION="${VERSION:-v0.6.0}"
COMMIT="${COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo "none")}"
while [ "$#" -gt 0 ]; do
  case "$1" in
    --version|-v)
      VERSION="$2"
      shift 2
      ;;
    --commit|-c)
      COMMIT="$2"
      shift 2
      ;;
    *)
      shift
      ;;
  esac
done
echo "Building TWSNMP NEO (Version: ${VERSION}, Commit: ${COMMIT})..."
mkdir -p ../bin
go build -tags wgpu24 -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" -o ../bin/twsnmpneo ./cmd/twsnmpneo
'''

[tasks.build-debug]
description = "Compile debug binary bundling frontend assets"
depends = ["build-frontend"]
dir = "backend"
run = '''
VERSION="${VERSION:-v0.6.0}"
COMMIT="${COMMIT:-$(git rev-parse --short HEAD 2>/dev/null || echo "none")}"
while [ "$#" -gt 0 ]; do
  case "$1" in
    --version|-v)
      VERSION="$2"
      shift 2
      ;;
    --commit|-c)
      COMMIT="$2"
      shift 2
      ;;
    *)
      shift
      ;;
  esac
done
mkdir -p ../bin
go build -tags "dev,wgpu24" -ldflags "-X main.version=${VERSION} -X main.commit=${COMMIT}" -o ../bin/twsnmpneo ./cmd/twsnmpneo
'''

[tasks.run-debug]
description = "Execute debug backend with air live reload on Go file changes"
depends = ["build-frontend"]
dir = "backend"
run = "air -c .air.toml"

[tasks.run-direct]
description = "Execute debug binary directly without live reload"
run = "./bin/twsnmpneo --datadir ./data --debug"

[tasks.e2e-install]
description = "Install E2E Playwright dependencies and Chromium browser"
dir = "e2e"
run = "pnpm install && pnpm exec playwright install chromium"

[tasks.e2e]
description = "Build frontend & backend, then run headless Playwright E2E tests"
depends = ["build"]
dir = "e2e"
run = "pnpm test"

[tasks.e2e-only]
description = "Run headless Playwright E2E tests using existing ./bin/twsnmpneo binary"
dir = "e2e"
run = "pnpm test"

[tasks.e2e-headed]
description = "Run Playwright E2E tests in a headed Chromium window"
depends = ["build"]
dir = "e2e"
run = "pnpm test:headed"

[tasks.e2e-report]
description = "Open the last Playwright HTML report"
dir = "e2e"
run = "pnpm exec playwright show-report"

[tasks.record-demo]
description = "Record demo walkthrough video (WebM/MP4/GIF) into e2e/output"
depends = ["build"]
dir = "e2e"
run = "pnpm run record:demo"

[tasks.capture-docs]
description = "Capture JA/EN documentation screenshots into e2e/output/docs-preview (use DOCS_WRITE=1 to overwrite docs/images)"
depends = ["build"]
dir = "e2e"
run = "pnpm run capture:docs"

